<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Switcher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Color Switcher</h1>
      <div>
        <button class="btn" id="randomBtn">Random Color</button>
        <input
          type="text"
          id="text"
          placeholder="Enter a color or hex(e.g. red or #fffff)"
        />
        <button class="btn" id="applyBtn">Apply Color</button>
      </div>
      <p>Current Color: <span id="currentColor">bisque</span></p>
      <script src="script.js"></script>
    </div>
  </body>
</html>
